<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Progressive Web App for plastic surgery clinical workflows - designed for interns and resident doctors" />
    <meta name="theme-color" content="#0E9F6E" />
    <meta name="app-version" content="5.0.0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/logo.png" color="#0E9F6E" />
    <!-- DNS prefetch for API -->
    <link rel="dns-prefetch" href="https://plasticsurgassisstant.vercel.app" />
    <title>Plastic Surgeon Assistant</title>
    <!-- Critical inline CSS for instant first paint -->
    <style>
      #app-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0fdf4;font-family:system-ui,-apple-system,sans-serif}
      #app-loader .logo{width:64px;height:64px;margin-bottom:16px;border-radius:16px}
      #app-loader h1{color:#0E9F6E;font-size:1.25rem;font-weight:600;margin:0 0 8px}
      #app-loader .bar{width:180px;height:3px;background:#d1fae5;border-radius:4px;overflow:hidden}
      #app-loader .bar-fill{width:30%;height:100%;background:#0E9F6E;border-radius:4px;animation:load 1.2s ease-in-out infinite}
      @keyframes load{0%{width:10%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:10%;margin-left:90%}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loading skeleton (replaced once React mounts) -->
      <div id="app-loader">
        <img class="logo" src="/logo.png" alt="" width="64" height="64" />
        <h1>PS Assistant</h1>
        <div class="bar"><div class="bar-fill"></div></div>
      </div>
    </div>
    
    <!-- Emergency IndexedDB Recovery Script - runs BEFORE app loads -->
    <script>
      (function() {
        // Check for ?recover=true parameter for forced recovery
        const urlParams = new URLSearchParams(window.location.search);
        const forceRecover = urlParams.get('recover') === 'true';
        
        if (forceRecover) {
          console.log('🚨 Emergency recovery triggered via URL parameter');
          
          // Show recovery message
          document.getElementById('root').innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;background:#f0f9f4;"><div style="text-align:center;padding:2rem;background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);"><h1 style="color:#0E9F6E;margin-bottom:1rem;">🔧 Database Recovery</h1><p style="color:#666;margin-bottom:1rem;">Clearing corrupted data...</p><div style="width:200px;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden;"><div id="progress" style="width:0%;height:100%;background:#0E9F6E;transition:width 0.3s;"></div></div><p id="status" style="color:#888;font-size:0.9rem;margin-top:1rem;">Starting...</p></div></div>';
          
          var progress = document.getElementById('progress');
          var status = document.getElementById('status');
          
          async function emergencyRecovery() {
            try {
              // Step 0: Try to message service worker to self-destruct
              status.textContent = 'Stopping service worker...';
              progress.style.width = '10%';
              if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                try {
                  navigator.serviceWorker.controller.postMessage({ type: 'EMERGENCY_UNREGISTER' });
                  await new Promise(resolve => setTimeout(resolve, 500));
                } catch (e) {
                  console.warn('Could not message service worker:', e);
                }
              }
              
              // Step 1: Unregister service workers
              status.textContent = 'Unregistering service workers...';
              progress.style.width = '20%';
              if ('serviceWorker' in navigator) {
                var registrations = await navigator.serviceWorker.getRegistrations();
                for (var reg of registrations) {
                  await reg.unregister();
                }
              }
              
              // Step 2: Clear all caches
              status.textContent = 'Clearing caches...';
              progress.style.width = '40%';
              if ('caches' in window) {
                var cacheKeys = await caches.keys();
                for (var key of cacheKeys) {
                  await caches.delete(key);
                }
              }
              
              // Step 3: Delete ALL IndexedDB databases (including all workbox variants)
              status.textContent = 'Deleting databases...';
              progress.style.width = '60%';
              var databasesToDelete = [
                'PlasticSurgeonDB',
                'workbox-expiration',
                'workbox-precache-v2',
                'workbox-precache',
                'workbox-background-sync',
                'workbox-runtime-cache',
                'keyval-store',
                'firebase-heartbeat-database',
                'firebase-installations-database',
                'firebaseLocalStorageDb'
              ];
              
              for (var dbName of databasesToDelete) {
                await new Promise(function(resolve) {
                  var req = indexedDB.deleteDatabase(dbName);
                  req.onsuccess = function() { console.log('Deleted:', dbName); resolve(); };
                  req.onerror = function() { console.warn('Error deleting:', dbName); resolve(); };
                  req.onblocked = function() { console.warn('Blocked:', dbName); resolve(); };
                  setTimeout(resolve, 1000); // Timeout safety
                });
              }
              
              // Step 4: Clear storage
              status.textContent = 'Clearing storage...';
              progress.style.width = '80%';
              try { localStorage.clear(); } catch(e) {}
              try { sessionStorage.clear(); } catch(e) {}
              
              // Step 5: Complete
              status.textContent = 'Recovery complete! Redirecting...';
              progress.style.width = '100%';
              
              // Remove recover param and reload with cache bypass
              setTimeout(function() {
                window.location.href = window.location.origin + window.location.pathname + '?t=' + Date.now();
              }, 1500);
              
            } catch (error) {
              console.error('Recovery error:', error);
              status.textContent = 'Error: ' + error.message + '. Please clear browser data manually.';
              status.style.color = '#DC2626';
            }
          }
          
          emergencyRecovery();
          return; // Don't load the app
        }
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
